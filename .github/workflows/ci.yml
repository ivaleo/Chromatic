name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить пакеты монорепо
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -e voronoi
          pip install ./combigeo          # нужен компилятор C++17; в ubuntu-latest есть
          pip install -e 'chromatic[dev]'

      # Тесты audit-data пока зависят от абсолютных путей и в CI не проходят.
      # Полный `pytest -q` возвращается вместе с пакетом chromatic_research
      # (план 2026-08-05, задача 11, шаг 11).
      - name: Тесты
        run: pytest -q voronoi/tests chromatic/tests combigeo/tests/python

      - name: Линтер
        run: ruff check .
